openapi: 3.1.0
info:
  title: Cafe Exito API
  version: 1.0.0
  description: >-
    Kontrak ini mencakup 81 operasi API setelah penambahan bukti pembayaran QRIS pada 20 November 2026.
    Path relatif terhadap /api/v1. Fitur inventori, stok bahan, supplier, pembelian,
    dan laporan pemakaian stok dikecualikan sesuai keputusan final klien. Pembayaran POS,
    pembatalan kuantitas, dan refund mengikuti aturan terbaru di API_DOCUMENTATION.md.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Customer
  - name: Attendance
  - name: Cashier
  - name: Station
  - name: Orders
  - name: Admin
  - name: Reports
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      security: []
      responses:
        '200': { description: API tersedia, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, description: Email atau username }
                password: { type: string, format: password }
      responses:
        '200': { description: Berhasil login, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    put:
      tags: [Auth]
      operationId: updateCurrentUser
      requestBody: { $ref: '#/components/requestBodies/UpdateProfile' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      requestBody: { $ref: '#/components/requestBodies/ChangePassword' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /customer/tables/{qrToken}:
    parameters: [{ $ref: '#/components/parameters/TableToken' }]
    get:
      tags: [Customer]
      operationId: getTableByQr
      security: []
      parameters: [{ $ref: '#/components/parameters/QrToken' }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /customer/menus:
    parameters: [{ $ref: '#/components/parameters/TableToken' }]
    get:
      tags: [Customer]
      operationId: listCustomerMenus
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /customer/cart/validate:
    parameters: [{ $ref: '#/components/parameters/TableToken' }]
    post:
      tags: [Customer]
      operationId: validateCart
      security: []
      requestBody: { $ref: '#/components/requestBodies/CartItems' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /customer/payment-info:
    parameters: [{ $ref: '#/components/parameters/TableToken' }]
    get:
      tags: [Customer]
      operationId: getPaymentInfo
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /customer/orders:
    parameters: [{ $ref: '#/components/parameters/TableToken' }]
    post:
      tags: [Customer]
      operationId: createCustomerOrder
      security: []
      requestBody: { $ref: '#/components/requestBodies/CustomerOrder' }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /customer/orders/{publicToken}:
    parameters: [{ $ref: '#/components/parameters/TableToken' }]
    get:
      tags: [Customer]
      operationId: getCustomerOrder
      security: []
      parameters: [{ name: publicToken, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /customer/orders/{publicToken}/cancel:
    post:
      tags: [Customer]
      operationId: cancelCustomerOrderItem
      security: []
      description: >-
        Customer may cancel an unstarted item quantity with a required reason. For verified
        payments this creates or merges a pending refund request for Owner decision; it does
        not execute a refund. Idempotency-Key replays the same cancellation.
      parameters: [{ name: publicToken, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 80 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detail_id, qty, reason]
              properties:
                detail_id: { type: integer, minimum: 1 }
                qty: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /customer/orders/{publicToken}/payment-proof:
    post:
      tags: [Customer]
      operationId: uploadCustomerQrisProof
      security: []
      description: >-
        Customer uploads a private JPEG, PNG, or WEBP file (maximum 3 MB). Upload does not
        settle payment. Cashier must manually inspect the proof and verify the QRIS payment.
      x-required-middleware: throttle:customer-proof
      parameters: [{ name: publicToken, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof: { type: string, format: binary, description: JPEG PNG or WEBP, max size 3 MB }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /attendance/today-status:
    get:
      tags: [Attendance]
      operationId: getAttendanceToday
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:attendance.record'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /attendance/check-in:
    post:
      tags: [Attendance]
      operationId: checkIn
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:attendance.record'
      requestBody: { $ref: '#/components/requestBodies/AttendanceEvent' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /attendance/check-out:
    post:
      tags: [Attendance]
      operationId: checkOut
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:attendance.record'
      requestBody: { $ref: '#/components/requestBodies/AttendanceEvent' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /attendance/my-history:
    get:
      tags: [Attendance]
      operationId: getMyAttendanceHistory
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:attendance.record'
      parameters: [{ $ref: '#/components/parameters/AttendanceFrom' }, { $ref: '#/components/parameters/AttendanceTo' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /attendance/list:
    get:
      tags: [Attendance]
      operationId: listAttendance
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:attendance.view_all'
      parameters: [{ $ref: '#/components/parameters/AttendanceFrom' }, { $ref: '#/components/parameters/AttendanceTo' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /attendance/{attendance}:
    patch:
      tags: [Attendance]
      operationId: correctAttendance
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:attendance.report'
      parameters: [{ name: attendance, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/AttendanceCorrection' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /attendance/events/{event}/photo:
    get:
      tags: [Attendance]
      operationId: getAttendancePhoto
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:attendance.record,attendance.report'
      parameters: [{ name: event, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Foto absensi, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cashier/dashboard:
    get:
      tags: [Cashier]
      operationId: getCashierDashboard
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:dashboard.cashier'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /cashier/tables:
    get:
      tags: [Cashier]
      operationId: listCashierTables
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:orders.create_pos'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /cashier/pos/orders:
    post:
      tags: [Cashier]
      operationId: createPosOrder
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:orders.create_pos'
      description: >-
        Creates a POS order with payment pending for either cash or static QRIS. Do not send
        amount_received here; cash settlement is recorded later by the cashier payment
        verification endpoint. Cash orders may enter production while unpaid. QRIS orders
        enter production only after manual cashier verification. Response is 201 with the
        standard success envelope and an Order resource whose payment status is pending.
      requestBody: { $ref: '#/components/requestBodies/PosOrder' }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /cashier/orders:
    get:
      tags: [Cashier]
      operationId: listCashierOrders
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:payments.verify'
      description: >-
        filter[status]=menunggu_pembayaran selects orders whose payment is pending, including
        orders already completed operationally. Other status values filter order status.
      parameters: [{ name: 'filter[status]', in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: search, in: query, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /cashier/orders/{order}:
    get:
      tags: [Cashier]
      operationId: getCashierOrder
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:payments.verify'
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /cashier/orders/{order}/complete:
    post:
      tags: [Cashier]
      operationId: completeCashierOrder
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:payments.verify'
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      description: Marks the order complete after all tickets finish; this does not settle a pending payment.
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /cashier/payments/{payment}/verify:
    post:
      tags: [Cashier]
      operationId: verifyPayment
      description: >-
        Cashier records settlement and manual verification. QRIS is static and has no gateway
        integration. Cash remains pending until this endpoint is called. It may be called after
        order completion; payment becomes verified while order status remains selesai. For
        cash, amount_received is optional and defaults to the exact payment amount. QRIS Self-Order
        cannot change its selected payment method and requires a pending customer proof before verify.
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:payments.verify'
      parameters: [{ name: payment, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/VerifyPayment' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /cashier/payments/{payment}/reject:
    post:
      tags: [Cashier]
      operationId: rejectPayment
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:payments.verify'
      parameters: [{ name: payment, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/RejectPayment' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /cashier/payments/{payment}/proof:
    get:
      tags: [Cashier]
      operationId: getCustomerQrisProof
      x-required-middleware: 'App\\Http\\Middleware\\EnsurePermission:payments.verify'
      parameters: [{ name: payment, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Private image proof, headers: { Cache-Control: { schema: { type: string } }, X-Content-Type-Options: { schema: { type: string } } }, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cashier/transactions/{order}/receipt:
    get:
      tags: [Cashier]
      operationId: getReceipt
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:payments.verify,transactions.view'
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /station/{station}/dashboard:
    get:
      tags: [Station]
      operationId: getStationDashboard
      x-required-middleware: 'App\Http\Middleware\EnsureStationAccess:read'
      parameters: [{ $ref: '#/components/parameters/Station' }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /station/{station}/tickets:
    get:
      tags: [Station]
      operationId: listStationTickets
      x-required-middleware: 'App\Http\Middleware\EnsureStationAccess:read'
      parameters: [{ $ref: '#/components/parameters/Station' }, { name: filter[status], in: query, schema: { type: string } }, { name: updated_since, in: query, schema: { type: string, format: date-time } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /station/{station}/tickets/{ticket}:
    get:
      tags: [Station]
      operationId: getStationTicket
      x-required-middleware: 'App\Http\Middleware\EnsureStationAccess:read'
      parameters: [{ $ref: '#/components/parameters/Station' }, { name: ticket, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /station/{station}/tickets/{ticket}/start:
    post:
      tags: [Station]
      operationId: startStationTicket
      x-required-middleware: 'App\Http\Middleware\EnsureStationAccess:act'
      parameters: [{ $ref: '#/components/parameters/Station' }, { name: ticket, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /station/{station}/tickets/{ticket}/items/{detail}/start:
    post:
      tags: [Station]
      operationId: startStationTicketItem
      x-required-middleware: 'permission:queue.<station>'
      parameters: [{ $ref: '#/components/parameters/Station' }, { name: ticket, in: path, required: true, schema: { type: integer } }, { name: detail, in: path, required: true, schema: { type: integer } }]
      description: Memulai seluruh kuantitas tersisa pada satu baris item. Baris item dari stasiun lain tidak berubah.
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /station/{station}/tickets/{ticket}/complete:
    post:
      tags: [Station]
      operationId: completeStationTicket
      x-required-middleware: 'App\Http\Middleware\EnsureStationAccess:act'
      parameters: [{ $ref: '#/components/parameters/Station' }, { name: ticket, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:orders.view'
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /orders/{order}:
    get:
      tags: [Orders]
      operationId: getOrder
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:orders.view'
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /orders/{order}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:orders.cancel'
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      description: >-
        Requires orders.cancel, granted to Owner. Cancels eligible unstarted remaining item
        quantities with a reason. For a verified payment, cancellation creates or merges a
        pending refund request for Owner decision; it does not approve or execute the refund.
      requestBody: { $ref: '#/components/requestBodies/CancelOrder' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /orders/{order}/items/cancel:
    post:
      tags: [Orders]
      operationId: ownerCancelOrderItem
      x-required-middleware: 'permission:orders.cancel'
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      description: Owner may cancel a specified unstarted quantity with a reason; a verified payment creates or merges a pending refund request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detail_id, qty, reason]
              properties:
                detail_id: { type: integer, minimum: 1 }
                qty: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /refunds:
    get:
      tags: [Orders]
      operationId: listRefundRequests
      x-required-middleware: 'permission:refund.view,refund.review'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Orders]
      operationId: createManualRefundRequest
      x-required-middleware: 'permission:refund.request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, amount, reason]
              properties:
                payment_id: { type: integer }
                amount: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /refunds/{refund}/decision:
    post:
      tags: [Orders]
      operationId: decideRefund
      x-required-middleware: 'permission:refund.review'
      parameters: [{ name: refund, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approved,rejected] }, reason: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /refunds/{refund}/withdraw:
    post:
      tags: [Orders]
      operationId: withdrawRefund
      x-required-middleware: 'permission:refund.view'
      parameters: [{ name: refund, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /refunds/{refund}/revoke:
    post:
      tags: [Orders]
      operationId: revokeRefundApproval
      x-required-middleware: 'permission:refund.review'
      parameters: [{ name: refund, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /refunds/{refund}/execute:
    post:
      tags: [Orders]
      operationId: executeRefund
      x-required-middleware: 'permission:refund.execute'
      parameters: [{ name: refund, in: path, required: true, schema: { type: integer } }]
      description: Cashier executes an Owner-approved refund. Cash requires confirm_cash=true; bank_transfer requires reference_number and proof upload.
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [method], properties: { method: { type: string, enum: [cash,bank_transfer] }, confirm_cash: { type: boolean }, reference_number: { type: string }, proof: { type: string, format: binary } } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /refunds/{refund}/proof:
    get:
      tags: [Orders]
      operationId: getRefundTransferProof
      x-required-middleware: 'permission:refund.view,refund.review'
      parameters: [{ name: refund, in: path, required: true, schema: { type: integer } }]
      description: Private transfer proof; access is limited to Owner and Cashier.
      responses:
        '200': { description: Private transfer proof file, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, application/pdf: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /refunds/{refund}/conflict-notes:
    get:
      tags: [Orders]
      operationId: listRefundConflictNotes
      x-required-middleware: 'permission:refund.review'
      parameters: [{ name: refund, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Orders]
      operationId: recordRefundConflictNote
      x-required-middleware: 'permission:refund.conflict.document'
      parameters: [{ name: refund, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [handled_by,resolved_on,outcome,reason,amount], properties: { handled_by: { type: string }, resolved_on: { type: string, format: date }, outcome: { type: string }, reason: { type: string }, amount: { type: integer }, proof: { type: string, format: binary } } } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /refund-conflict-notes/{note}/verify:
    post:
      tags: [Orders]
      operationId: verifyRefundConflictNote
      x-required-middleware: 'permission:refund.review'
      parameters: [{ name: note, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /refund-conflict-notes/{note}/proof:
