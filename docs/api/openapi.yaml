components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    QrToken: { name: qrToken, in: path, required: true, schema: { type: string } }
    TableToken: { name: X-Table-Token, in: header, required: false, schema: { type: string }, description: Optional QR token; the API validates it when supplied. }
    OrderId: { name: order, in: path, required: true, schema: { type: integer } }
    Station: { name: station, in: path, required: true, schema: { type: string, enum: [barista, kitchen] } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    AttendanceFrom: { name: from, in: query, schema: { type: string, format: date } }
    AttendanceTo: { name: to, in: query, schema: { type: string, format: date } }
  requestBodies:
    AttendanceCorrection:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceCorrection' } } }
    SaveMenu:
      required: true
      content:
        multipart/form-data: { schema: { $ref: '#/components/schemas/SaveMenu' } }
    MenuAvailability:
      required: true
      content: { application/json: { schema: { type: object, required: [is_available], properties: { is_available: { type: boolean } } } } }
    SaveTable:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SaveTable' } } }
    CreateStaffUser:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CreateStaffUser' } } }
    UpdateStaffUser:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStaffUser' } } }
    UserStatus:
      required: true
      content: { application/json: { schema: { type: object, required: [is_active], properties: { is_active: { type: boolean } } } } }
    ResetUserPassword:
      required: true
      content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8, maxLength: 100 } } } } }
    SavePermissions:
      required: true
      content: { application/json: { schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { type: string, enum: [queue.barista, queue.kitchen, menus.view, attendance.record] } } } } } }
    UpdateProfile:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfile' } } }
    ChangePassword:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ChangePassword' } } }
    CartItems:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CartItems' } } }
    CustomerOrder:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CustomerOrder' } } }
    PosOrder:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PosOrder' } } }
    VerifyPayment:
      required: false
      content: { application/json: { schema: { $ref: '#/components/schemas/VerifyPayment' } } }
    RejectPayment:
      required: false
      content: { application/json: { schema: { $ref: '#/components/schemas/RejectPayment' } } }
    CancelOrder:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CancelOrder' } } }
    Success:
      type: object
      required: [success, message, data, meta]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
        meta:
          type: object
          properties:
            request_id: { type: [string, 'null'] }
            server_time: { type: string, format: date-time }
            pagination: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [success, message, error, meta]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
            details: {}
        errors: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
security:
  - bearerAuth: []
