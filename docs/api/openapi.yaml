  /admin/tables/{table}:
    put:
      tags: [Admin]
      operationId: updateTable
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:tables.manage'
      parameters: [{ name: table, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/SaveTable' }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [Admin]
      operationId: deleteTable
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:tables.manage'
      parameters: [{ name: table, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/tables/{table}/regenerate-qr:
    post:
      tags: [Admin]
      operationId: regenerateTableQr
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:tables.manage'
      parameters: [{ name: table, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:users.manage'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin]
      operationId: createUser
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:users.manage'
      requestBody: { $ref: '#/components/requestBodies/CreateStaffUser' }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/users/{user}:
    put:
      tags: [Admin]
      operationId: updateUser
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:users.manage'
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/UpdateStaffUser' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/users/{user}/status:
    patch:
      tags: [Admin]
      operationId: updateUserStatus
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:users.manage'
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/UserStatus' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/users/{user}/reset-password:
    post:
      tags: [Admin]
      operationId: resetUserPassword
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:users.manage'
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/ResetUserPassword' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/users/{user}/permissions:
    get:
      tags: [Admin]
      operationId: getUserPermissions
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:permissions.grant'
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    put:
      tags: [Admin]
      operationId: updateUserPermissions
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:permissions.grant'
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/SavePermissions' }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /dashboard/owner:
    get:
      tags: [Reports]
      operationId: getOwnerDashboard
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:dashboard.owner'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /dashboard/manager:
    get:
      tags: [Reports]
      operationId: getManagerDashboard
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:dashboard.manager'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /reports/sales:
    get:
      tags: [Reports]
      operationId: getSalesReport
      description: >-
        Sales summary totals include orders, revenue, average_order, items, refunds_approved and
        refunds_completed. Refund values are integer rupiah amounts.
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:reports.view'
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [daily, weekly, monthly] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day] } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /audit-logs:
    get:
      tags: [Reports]
      operationId: listAuditLogs
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:audit.view'
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /staff/alerts:
    get:
      tags: [Reports]
      operationId: getStaffAlerts
      responses: { '200': { $ref: '#/components/responses/Ok' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    QrToken: { name: qrToken, in: path, required: true, schema: { type: string } }
    TableToken: { name: X-Table-Token, in: header, required: false, schema: { type: string }, description: Optional QR token; the API validates it when supplied. }
    OrderId: { name: order, in: path, required: true, schema: { type: integer } }
    Station: { name: station, in: path, required: true, schema: { type: string, enum: [barista, kitchen] } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    AttendanceFrom: { name: from, in: query, schema: { type: string, format: date } }
    AttendanceTo: { name: to, in: query, schema: { type: string, format: date } }
  requestBodies:
    AttendanceCorrection:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceCorrection' } } }
    SaveMenu:
      required: true
      content:
        multipart/form-data: { schema: { $ref: '#/components/schemas/SaveMenu' } }
    MenuAvailability:
      required: true
      content: { application/json: { schema: { type: object, required: [is_available], properties: { is_available: { type: boolean } } } } }
    SaveTable:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SaveTable' } } }
    CreateStaffUser:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CreateStaffUser' } } }
    UpdateStaffUser:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStaffUser' } } }
    UserStatus:
      required: true
      content: { application/json: { schema: { type: object, required: [is_active], properties: { is_active: { type: boolean } } } } }
    ResetUserPassword:
      required: true
      content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8, maxLength: 100 } } } } }
    SavePermissions:
      required: true
      content: { application/json: { schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { type: string, enum: [queue.barista, queue.kitchen, menus.view, attendance.record] } } } } } }
    UpdateProfile:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfile' } } }
    ChangePassword:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ChangePassword' } } }
    CartItems:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CartItems' } } }
    CustomerOrder:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CustomerOrder' } } }
    PosOrder:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PosOrder' } } }
    VerifyPayment:
      required: false
      content: { application/json: { schema: { $ref: '#/components/schemas/VerifyPayment' } } }
    RejectPayment:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RejectPayment' } } }
    CancelOrder:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CancelOrder' } } }
    AttendanceEvent:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [photo, latitude, longitude]
            properties:
              photo: { type: string, format: binary, description: JPEG, PNG, atau WebP; maksimum 2 MB }
              latitude: { type: number, minimum: -90, maximum: 90 }
              longitude: { type: number, minimum: -180, maximum: 180 }
              accuracy_meters: { type: [number, 'null'], minimum: 0, maximum: 100000 }
              device_info: { type: [string, 'null'] }
              notes: { type: [string, 'null'] }
  responses:
    Ok:
      description: Operasi berhasil
      content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } }
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Pengguna tidak memiliki izin
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource tidak ditemukan
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Konflik status bisnis
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Data tidak lolos validasi
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    AttendanceCorrection:
      type: object
      required: [reason]
      properties:
        check_in_at: { type: [string, 'null'], format: date-time }
        check_out_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [present, absent, sick, leave] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    SaveMenu:
      type: object
      required: [name, category_id, price]
      properties:
        name: { type: string, maxLength: 120 }
        sku: { type: [string, 'null'], maxLength: 30 }
        category_id: { type: integer }
        price: { type: integer, minimum: 0 }
        cost_price: { type: [integer, 'null'], minimum: 0 }
        station: { type: [string, 'null'], enum: [barista, kitchen, 'null'] }
        image: { type: string, format: binary }
    SaveTable:
      type: object
      required: [table_number]
      properties:
        table_number: { type: string, maxLength: 10 }
        status: { type: [string, 'null'], enum: [active, inactive, 'null'] }
    CreateStaffUser:
      type: object
      required: [name, username, email, role, password]
      properties:
        name: { type: string, maxLength: 100 }
        username: { type: string, maxLength: 50, pattern: '^[a-z0-9._]+$' }
        email: { type: string, format: email, maxLength: 150 }
        role: { type: string, enum: [manager, kasir, barista_kitchen] }
        station: { type: string, enum: [barista, kitchen], description: Required for role barista_kitchen }
        password: { type: string, minLength: 8, maxLength: 100 }
    UpdateStaffUser:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        username: { type: string, maxLength: 50, pattern: '^[a-z0-9._]+$' }
        email: { type: string, format: email, maxLength: 150 }
        role: { type: string, enum: [manager, kasir, barista_kitchen] }
        station: { type: string, enum: [barista, kitchen], description: Required when changing/assigning barista_kitchen }
    UpdateProfile:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 150 }
    ChangePassword:
      type: object
      required: [current_password, password]
      properties:
        current_password: { type: string }
        password: { type: string, minLength: 8, maxLength: 100, description: Must differ from current_password }
    CartItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CartItem' }
    CartItem:
      type: object
      required: [menu_id, qty]
      properties:
        menu_id: { type: integer }
        qty: { type: integer, minimum: 1 }
    CustomerOrder:
      allOf:
        - $ref: '#/components/schemas/CartItems'
        - type: object
          required: [payment_method]
          properties:
            table_number: { type: [string, 'null'], maxLength: 10 }
            service_type: { type: string, enum: [dine_in, takeaway] }
            customer_name: { type: [string, 'null'], maxLength: 100 }
            payment_method: { type: string, enum: [tunai, qris] }
            client_request_id: { type: [string, 'null'], format: uuid }
    PosOrder:
      allOf:
        - $ref: '#/components/schemas/CartItems'
        - type: object
          required: [client_request_id, service_type, payment_method]
          properties:
            client_request_id: { type: string, format: uuid }
            service_type: { type: string, enum: [dine_in, takeaway] }
            table_number: { type: [string, 'null'], maxLength: 10 }
            customer_name: { type: [string, 'null'], maxLength: 100 }
            payment_method: { type: string, enum: [tunai, qris] }
    VerifyPayment:
      type: object
      properties:
        method: { type: [string, 'null'], enum: [tunai, qris, 'null'] }
        amount_received: { type: [integer, 'null'], minimum: 0 }
    RejectPayment:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 255 }
    CancelOrder:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    Success:
      type: object
      required: [success, message, data, meta]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
        meta:
          type: object
          properties:
            request_id: { type: [string, 'null'] }
            server_time: { type: string, format: date-time }
            pagination: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [success, message, error, meta]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
            details: {}
        errors: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
security:
  - bearerAuth: []
