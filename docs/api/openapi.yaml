      x-required-middleware: 'permission:refund.conflict.document,refund.review'
      parameters: [{ name: note, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Private proof file }, '404': { $ref: '#/components/responses/NotFound' } }
  /notifications:
