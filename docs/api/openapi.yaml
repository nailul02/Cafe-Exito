  /admin/tables:
    get:
      tags: [Admin]
      operationId: listTables
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:tables.manage'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin]
      operationId: createTable
      x-required-middleware: 'App\Http\Middleware\EnsurePermission:tables.manage'
      requestBody: { $ref: '#/components/requestBodies/SaveTable' }
